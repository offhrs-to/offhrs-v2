# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "offhrs"
client_id = "93ac1547c426534f421ce570acb3bc9d"
application_url = "https://offhrs.app/shopify"
embedded = true

[access_scopes]
# Phase 2–3: listings feeds, resource feedback, storefront token for cart attribution.
scopes = "read_products,read_inventory,read_product_listings,write_resource_feedbacks,unauthenticated_read_product_listings"
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://offhrs.app/api/partners/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://offhrs.app/api/webhooks/shopify"
